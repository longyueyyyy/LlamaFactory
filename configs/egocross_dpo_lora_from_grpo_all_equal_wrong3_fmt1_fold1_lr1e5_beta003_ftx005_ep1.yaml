### model
model_name_or_path: saves/egocross/qwen3vl4b/grpo_v3_train_rope_default
trust_remote_code: true
image_max_pixels: 200000
video_max_pixels: 200000
image_min_pixels: 50176

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
pref_loss: sigmoid
pref_beta: 0.03
pref_ftx: 0.05

### dataset
dataset: egocross_pref_answer_only_all_equal_wrong3_fmt1_fold1
dataset_dir: ./data
media_dir: /share/home/group9/data/egocross
template: qwen3_vl
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/egocross/qwen3vl4b/dpo_lora_from_grpo_all_equal_wrong3_fmt1_fold1_lr1e5_beta003_ftx005_ep1
logging_steps: 5
save_steps: 999999
save_total_limit: 1
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1
